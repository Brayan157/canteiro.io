services:
  postgres:
    image: postgres:17-alpine
    container_name: canteiro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?copy .env.example to .env and set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env and set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env and set POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.28
    container_name: canteiro-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_WEB_PORT:-8025}:8025"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: canteiro-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      DATABASE_USERNAME: ${POSTGRES_USER:?POSTGRES_USER is required}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      EMPLOYEE_PAYMENT_ENCRYPTION_KEY: ${EMPLOYEE_PAYMENT_ENCRYPTION_KEY:?EMPLOYEE_PAYMENT_ENCRYPTION_KEY is required and must differ from JWT_SECRET}
      LOCAL_STORAGE_BASE_PATH: /app/var/storage
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_SMTP_AUTH: false
      MAIL_SMTP_STARTTLS: false
      MAIL_FROM: ${MAIL_FROM:-no-reply@canteiro.local}
      FRONTEND_ACTIVATION_URL: ${FRONTEND_ACTIVATION_URL:-http://localhost:5173/ativar-conta}
      FRONTEND_PASSWORD_RESET_URL: ${FRONTEND_PASSWORD_RESET_URL:-http://localhost:5173/redefinir-senha}
      BOOTSTRAP_PLATFORM_OWNER_ENABLED: ${BOOTSTRAP_PLATFORM_OWNER_ENABLED:-false}
      BOOTSTRAP_PLATFORM_OWNER_EMAIL: ${BOOTSTRAP_PLATFORM_OWNER_EMAIL:-}
      BOOTSTRAP_PLATFORM_OWNER_PASSWORD: ${BOOTSTRAP_PLATFORM_OWNER_PASSWORD:-}
      BOOTSTRAP_TRUST_UNLOCK_DEMO_ENABLED: ${BOOTSTRAP_TRUST_UNLOCK_DEMO_ENABLED:-false}
      BOOTSTRAP_TRUST_UNLOCK_DEMO_COMPANY_USER_EMAIL: ${BOOTSTRAP_TRUST_UNLOCK_DEMO_COMPANY_USER_EMAIL:-blocked-demo@canteiro.local}
      BOOTSTRAP_TRUST_UNLOCK_DEMO_COMPANY_USER_PASSWORD: ${BOOTSTRAP_TRUST_UNLOCK_DEMO_COMPANY_USER_PASSWORD:-}
    volumes:
      - api-storage:/app/var/storage
    ports:
      - "${APP_PORT:-8081}:8080"

volumes:
  postgres-data:
  api-storage:
    name: canteiroio-api-private-storage
