# Application defaults shared by all profiles
spring.application.name=canteiro.io
spring.profiles.default=local
spring.config.import=optional:file:./.env[.properties]

# JPA and Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Server
server.port=${SERVER_PORT:8080}

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger
springdoc.api-docs.path=/v3/api-docs

# Local development attachment storage; production must replace this adapter with object storage.
storage.local.base-path=${LOCAL_STORAGE_BASE_PATH:./var/storage}
spring.servlet.multipart.max-file-size=${ATTACHMENT_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${ATTACHMENT_MAX_REQUEST_SIZE:10MB}

# Authentication
security.jwt.issuer=${JWT_ISSUER:canteiro.io}
security.jwt.secret=${JWT_SECRET}
security.jwt.access-token-ttl=PT15M
security.jwt.refresh-token-ttl=P30D
security.refresh-cookie.name=canteiro_refresh
security.refresh-cookie.path=/api/v1/auth
security.refresh-cookie.secure=${REFRESH_COOKIE_SECURE:true}
security.refresh-cookie.same-site=Strict
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Password reset and SMTP delivery
security.account-activation.token-ttl=PT24H
security.account-activation.email-from=${MAIL_FROM:}
security.account-activation.frontend-activation-url=${FRONTEND_ACTIVATION_URL:http://localhost:5173/ativar-conta}
security.employee-payment-data.encryption-key=${EMPLOYEE_PAYMENT_ENCRYPTION_KEY:${security.jwt.secret}}
security.password-reset.token-ttl=PT1H
security.password-reset.email-from=${MAIL_FROM:}
security.password-reset.frontend-password-reset-url=${FRONTEND_PASSWORD_RESET_URL:http://localhost:5173/redefinir-senha}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

# Asaas sandbox integration (disabled until sandbox credentials are configured)
integrations.asaas.enabled=${ASAAS_ENABLED:false}
integrations.asaas.base-url=${ASAAS_BASE_URL:https://api-sandbox.asaas.com/v3}
integrations.asaas.api-key=${ASAAS_API_KEY:}
integrations.asaas.webhook-token=${ASAAS_WEBHOOK_TOKEN:}
integrations.asaas.user-agent=${ASAAS_USER_AGENT:canteiro.io/0.0.1 (Java 21; sandbox)}
integrations.asaas.webhook-zone=${ASAAS_WEBHOOK_ZONE:America/Sao_Paulo}

# Subscription dunning
subscription.dunning.enabled=${SUBSCRIPTION_DUNNING_ENABLED:true}
subscription.dunning.schedule=${SUBSCRIPTION_DUNNING_SCHEDULE:0 15 3 * * *}
subscription.dunning.zone=${SUBSCRIPTION_DUNNING_ZONE:America/Sao_Paulo}

# Notification delivery for subscription dunning notices.
notifications.email.from=${MAIL_FROM:}
notifications.delivery.enabled=${NOTIFICATION_DELIVERY_ENABLED:true}
notifications.delivery.schedule=${NOTIFICATION_DELIVERY_SCHEDULE:0 */5 * * * *}
notifications.delivery.zone=${NOTIFICATION_DELIVERY_ZONE:America/Sao_Paulo}
notifications.delivery.batch-size=${NOTIFICATION_DELIVERY_BATCH_SIZE:25}
notifications.delivery.retry-after=${NOTIFICATION_DELIVERY_RETRY_AFTER:PT15M}

# Payment webhook reprocessing and periodic reconciliation
subscription.payment-synchronization.enabled=${PAYMENT_SYNCHRONIZATION_ENABLED:true}
subscription.payment-synchronization.event-delay=${PAYMENT_EVENT_DELAY:PT10S}
subscription.payment-synchronization.reconciliation-delay=${PAYMENT_RECONCILIATION_DELAY:PT30M}
subscription.payment-synchronization.batch-size=${PAYMENT_SYNCHRONIZATION_BATCH_SIZE:50}
subscription.payment-synchronization.retry-after=${PAYMENT_EVENT_RETRY_AFTER:PT5M}
