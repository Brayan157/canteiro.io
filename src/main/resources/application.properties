# Application defaults shared by all profiles
spring.application.name=canteiro.io
spring.profiles.default=local
spring.config.import=optional:file:./.env[.properties]

# JPA and Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Server
server.port=${SERVER_PORT:8080}

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger
springdoc.api-docs.path=/api-docs

# Authentication
security.jwt.issuer=${JWT_ISSUER:canteiro.io}
security.jwt.secret=${JWT_SECRET}
security.jwt.access-token-ttl=PT15M
security.jwt.refresh-token-ttl=P30D

# Password reset and SMTP delivery
security.account-activation.token-ttl=PT24H
security.account-activation.email-from=${MAIL_FROM:}
security.password-reset.token-ttl=PT1H
security.password-reset.email-from=${MAIL_FROM:}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
