spring.config.activate.on-profile=test

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.flyway.enabled=true
security.jwt.issuer=canteiro.io-test
security.jwt.secret=test-only-signing-secret-with-at-least-thirty-two-characters
security.jwt.access-token-ttl=PT15M
security.jwt.refresh-token-ttl=P30D
security.refresh-cookie.name=canteiro_refresh
security.refresh-cookie.path=/api/v1/auth
security.refresh-cookie.secure=false
security.refresh-cookie.same-site=Strict
security.cors.allowed-origins=http://localhost:5173
security.account-activation.token-ttl=PT24H
security.account-activation.email-from=test@canteiro.io
security.account-activation.frontend-activation-url=https://frontend.test/ativar-conta
security.password-reset.token-ttl=PT1H
security.password-reset.email-from=test@canteiro.io
security.password-reset.frontend-password-reset-url=https://frontend.test/redefinir-senha
security.employee-payment-data.encryption-key=test-only-employee-payment-encryption-key
subscription.dunning.enabled=false
subscription.payment-synchronization.batch-size=25
subscription.payment-synchronization.retry-after=PT5M
notifications.delivery.enabled=false
notifications.delivery.batch-size=25
notifications.delivery.retry-after=PT15M
