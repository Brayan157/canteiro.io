spring.config.activate.on-profile=local

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB:canteiro}}
spring.datasource.username=${DATABASE_USERNAME:${POSTGRES_USER:canteiro}}
spring.datasource.password=${DATABASE_PASSWORD:${POSTGRES_PASSWORD}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

security.refresh-cookie.secure=false

bootstrap.platform-owner.enabled=${BOOTSTRAP_PLATFORM_OWNER_ENABLED:false}
bootstrap.platform-owner.email=${BOOTSTRAP_PLATFORM_OWNER_EMAIL:}
bootstrap.platform-owner.password=${BOOTSTRAP_PLATFORM_OWNER_PASSWORD:}

# Disabled by default. When enabled, creates one overdue, blocked local-only company for the trust-unlock UI.
bootstrap.trust-unlock-demo.enabled=${BOOTSTRAP_TRUST_UNLOCK_DEMO_ENABLED:false}
bootstrap.trust-unlock-demo.company-user-email=${BOOTSTRAP_TRUST_UNLOCK_DEMO_COMPANY_USER_EMAIL:blocked-demo@canteiro.local}
bootstrap.trust-unlock-demo.company-user-password=${BOOTSTRAP_TRUST_UNLOCK_DEMO_COMPANY_USER_PASSWORD:}
